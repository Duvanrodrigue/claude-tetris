<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="game-title" aria-label="Tetris">
    <span style="color:#e57373">T</span><span style="color:#f2a65a">E</span><span style="color:#e5c07b">T</span><span style="color:#98c379">R</span><span style="color:#7aa2f7">I</span><span style="color:#c792ea">S</span>
  </h1>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd>/<kbd>Esc</kbd> pausa</li>
          </ul>
        </div>

        <!-- Skins -->
        <div class="panel-section skin-section">
          <label class="label" for="skin-select">SKIN</label>
          <select id="skin-select">
            <option value="retro">Retro</option>
            <option value="neon">Neon</option>
            <option value="pastel">Pastel</option>
            <option value="pixel">Pixel art</option>
          </select>
        </div>
        <!-- Fin skins -->
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box" id="gameover-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <!-- Records: inicio -->
        <div id="records-panel" hidden>
          <div id="records-entry" hidden>
            <input id="records-name" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
            <button id="records-save" type="button">Guardar</button>
          </div>
          <ol id="records-list"></ol>
          <p id="records-stats"></p>
          <button id="records-reset" type="button">Resetear records</button>
        </div>
        <!-- Records: fin -->
        <button id="restart-btn">Reiniciar</button>
      </div>

      <!-- Menú de pausa -->
      <div id="pause-menu" class="overlay-box">
        <p id="pause-title">PAUSA</p>
        <button id="resume-btn" class="menu-btn">Reanudar</button>
        <button id="pause-restart-btn" class="menu-btn">Reiniciar</button>
        <button id="controls-btn" class="menu-btn">Ver controles</button>
        <ul id="pause-controls" class="hidden">
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd>/<kbd>X</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>P</kbd>/<kbd>Esc</kbd> pausa</li>
        </ul>
        <label class="menu-label">Nivel inicial
          <select id="start-level">
            <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
          </select>
        </label>
      </div>
      <!-- Fin menú de pausa -->
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
